name: Build MyGym Workspace Native Flutter APK
on:
  push:
    branches: [main]
    paths:
      - 'mygym_workspace/**'
      - '.github/workflows/mygym-workspace-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native Android project
        working-directory: mygym_workspace/flutter_app
        run: |
          flutter create --platforms=android --org com.rconsoft --project-name mygym_workspace .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          s = s.replace('android:label="mygym_workspace"', 'android:label="MyGym Workspace"')
          p.write_text(s)
          PY
          flutter pub get
      - name: Dart static analysis
        working-directory: mygym_workspace/flutter_app
        run: flutter analyze lib --no-fatal-infos
      - name: Compile Flutter APK
        working-directory: mygym_workspace/flutter_app
        run: flutter build apk --release
      - name: Upload MyGym Workspace APK
        uses: actions/upload-artifact@v4
        with:
          name: MyGym_Workspace_APK
          path: mygym_workspace/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30